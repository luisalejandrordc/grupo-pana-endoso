  /sales:
    get:
      tags: [Sales]
      operationId: listSales
      summary: List sales in the caller's scope (workspace)
      description: |
        Admins and Managers see every sale; an Advisor only the sales assigned to them. `q` searches the customer
        name, series, VIN and plate, and the start of the customer document. `milestone` returns the sales whose
        milestone is in progress.
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - {
            name: state,
            in: query,
            schema: { $ref: "#/components/schemas/SaleState" },
          }
        - {
            name: currentTask,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 13 },
          }
        - {
            name: milestone,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 6 },
          }
        - { name: advisorId, in: query, schema: { type: string, format: uuid } }
        - { name: customerType, in: query, schema: { type: string } }
        - {
            name: temperature,
            in: query,
            schema: { $ref: "#/components/schemas/SaleTemperature" },
          }
        - { name: modelId, in: query, schema: { type: string, format: uuid } }
        - { name: versionId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [createdAt, -createdAt, customerName, -customerName],
              },
          }
      responses:
        "200":
          description: One page of sales.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Sales]
      operationId: createSale
      summary: Register a sale
      description: |
        Snapshots the customer and the vehicle, assigns the advisor and creates the 13 pending tasks in one
        transaction. An Advisor may omit `assignedAdvisorId` or send their own id; a Manager or Admin must send an
        active Advisor. An inactive customer answers CUSTOMER_INACTIVE; a version or color that cannot be selected
        answers VEHICLE_NOT_SELECTABLE or VEHICLE_COLOR_MISMATCH.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSaleRequest" }
      responses:
        "201":
          description: The new sale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    get:
      tags: [Sales]
      operationId: getSale
      summary: Read a sale with its milestones
      description: A sale outside an Advisor's scope answers 404, as if it did not exist.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The sale.
          content:
