        [slotCode, taskNumber, label, allowedFormat, customerVisible, required]
      properties:
        slotCode: { type: string }
        taskNumber: { type: integer, minimum: 1, maximum: 13 }
        label: { type: string }
        allowedFormat: { type: string, enum: [pdf, excel] }
        customerVisible:
          {
            type: boolean,
            description: Fixed by the slot; the customer portal shows only these.,
          }
        required:
          {
            type: boolean,
            description: Needed to complete the task for this sale's customer type.,
          }
        file:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DocumentFile"
    DocumentSlotList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DocumentSlot" }
    DeleteSaleRequest:
      type: object
      required: [reason, confirm]
      properties:
        reason: { type: string, minLength: 1 }
        confirm:
          {
            type: string,
            description: "The sale code, typed by the person as confirmation.",
          }
    PhotoLink:
      type: object
      required: [url, expiresAt, mimeType]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        mimeType: { type: string }
    DocumentDownload:
      type: object
      required: [url, expiresAt, fileName, mimeType]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        fileName: { type: string }
        mimeType: { type: string }
    TaskDocumentFile:
      type: object
      required: [id, fileName, mimeType, sizeBytes, uploadedAt, uploadedByName]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        uploadedAt: { type: string, format: date-time }
        uploadedByName: { type: string }
    TaskDocumentSlot:
      type: object
      required: [slotCode, label, allowedFormat, required, customerVisible]
      properties:
        slotCode: { type: string }
        label: { type: string }
        allowedFormat: { type: string }
        required:
          {
            type: boolean,
            description: Already accounts for the customer type (the power of attorney is required unless the customer is a Diplomático).,
          }
        customerVisible: { type: boolean }
        file:
          {
            allOf: [{ $ref: "#/components/schemas/TaskDocumentFile" }],
            nullable: true,
          }
    TaskWarning:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string, enum: [DATE_OUT_OF_ORDER, DATE_IN_THE_FUTURE] }
        message: { type: string }
    TaskPermissions:
      type: object
      required:
        [
          canStart,
          canComplete,
          canEditData,
          needsReason,
          canSaveNotes,
          canRestart,
          canReopen,
          canUploadDocuments,
          canRemoveDocuments,
        ]
      properties:
        canStart: { type: boolean }
        canComplete: { type: boolean }
        canEditData: { type: boolean }
        needsReason:
          {
            type: boolean,
            description: Editing a completed task needs a written reason.,
          }
        canSaveNotes: { type: boolean }
        canRestart: { type: boolean }
        canReopen: { type: boolean }
        canUploadDocuments:
          {
            type: boolean,
            description: Files can be added or replaced wherever the data can be edited.,
          }
        canRemoveDocuments:
          {
            type: boolean,
            description: Files can only be removed while the task is in progress.,
          }
    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/TaskSummary"
        - type: object
          required: [saleId, data, calculated, documents, warnings, permissions]
          properties:
            saleId: { type: string, format: uuid }
            notes: { type: string, nullable: true }
            data:
              description: The task's fields; the shape depends on the task number.
              oneOf:
                - $ref: "#/components/schemas/Task1Data"
                - $ref: "#/components/schemas/Task2Data"
                - $ref: "#/components/schemas/Task3Data"
                - $ref: "#/components/schemas/PaymentData"
                - $ref: "#/components/schemas/Task6Data"
                - $ref: "#/components/schemas/Task8Data"
                - $ref: "#/components/schemas/Task9Data"
                - $ref: "#/components/schemas/Task10Data"
                - $ref: "#/components/schemas/Task11Data"
                - $ref: "#/components/schemas/Task12Data"
                - $ref: "#/components/schemas/Task13Data"
                - { type: object, description: "Task 7 has no fields." }
            calculated:
              type: object
              additionalProperties: true
              description: |
                Values computed from the saved data, never typed in. Task 1: quotedFinalPrice. Task 3: quotedFinalPrice and
                finalCommission. Tasks 4 and 5: expectedAmount and amountsMatch. Task 6: per invoice, expectedAmount and amountsMatch.
            documents:
              type: array
              items: { $ref: "#/components/schemas/TaskDocumentSlot" }
            warnings:
              type: array
              items: { $ref: "#/components/schemas/TaskWarning" }
            permissions: { $ref: "#/components/schemas/TaskPermissions" }
    SaveTaskDataRequest:
      type: object
      required: [version, data]
      properties:
        version:
          { type: integer, description: "The task's version, as last read." }
        reason:
          {
            type: string,
            description: Required when the task is already completed.,
          }
        data:
          description: "The fields to change. Absent fields are left alone; an empty string clears a field. Unknown fields are refused."
          oneOf:
            - $ref: "#/components/schemas/Task1Data"
            - $ref: "#/components/schemas/Task2Data"
            - $ref: "#/components/schemas/Task3Data"
            - $ref: "#/components/schemas/PaymentData"
            - $ref: "#/components/schemas/Task6Data"
            - $ref: "#/components/schemas/Task8Data"
            - $ref: "#/components/schemas/Task9Data"
            - $ref: "#/components/schemas/Task10Data"
            - $ref: "#/components/schemas/Task11Data"
            - $ref: "#/components/schemas/Task12Data"
            - $ref: "#/components/schemas/Task13Data"
    SaveTaskNotesRequest:
      type: object
      properties:
        notes: { type: string, maxLength: 2000 }
    Task1Data:
      type: object
      description: "Task 1: the initial quotation amounts."
      properties:
        initialToyotaAmount:
          {
            type: string,
            nullable: true,
            example: "1250.50",
            description: Decimal string with two decimals.,
          }
        initialCommission:
          {
            type: string,
            nullable: true,
            example: "1250.50",
            description: Decimal string with two decimals.,
          }
        accessoryAmount:
          {
            type: string,
            nullable: true,
            example: "1250.50",
            description: Decimal string with two decimals.,
          }
        releaseProcessingAmount:
          {
            type: string,
            nullable: true,
            example: "1250.50",
            description: Decimal string with two decimals.,
          }
    Task2Data:
      type: object
      description: "Task 2: the person who signs and the due-diligence classification."
      properties:
        signerDocumentType:
          { type: string, enum: [DNI, CE, PAS, CDI], nullable: true }
        signerDocumentNumber: { type: string, nullable: true }
        signerFirstName: { type: string, nullable: true }
        signerLastName: { type: string, nullable: true }
        signerNameSource:
          { type: string, enum: [manual, looked_up], nullable: true }
        pepStatus:
          { type: string, enum: [no_pep, pep, related_to_pep], nullable: true }
        ddcRegime: { type: string, enum: [general, reinforced], nullable: true }
    Task3Data:
      type: object
      description: "Task 3: the unit assigned and the final amount Toyota charges. The final commission is calculated: initial Toyota amount plus initial commission minus the final Toyota amount, and must stay positive."
      properties:
        vehicleSeries: { type: string, nullable: true }
        vin:
          {
            type: string,
            nullable: true,
            description: "17 characters without I, O or Q.",
          }
        finalToyotaAmount:
          {
            type: string,
            nullable: true,
            example: "1250.50",
            description: Decimal string with two decimals.,
          }
    PaymentData:
      type: object
      description: "Tasks 4 (customer to Pana, expected amount = the quoted final price) and 5 (Pana to Toyota, expected amount = the final Toyota amount): one bank deposit. A deposit that differs from the expected amount needs a mismatchReason to complete."
      properties:
        bank:
          {
            type: string,
            enum: [bcp, bbva, scotiabank, interbank],
            nullable: true,
          }
        paymentDate: { type: string, format: date, nullable: true }
        transactionNumber: { type: string, nullable: true }
        depositedAmount:
          {
            type: string,
            nullable: true,
            example: "1250.50",
            description: Decimal string with two decimals.,
          }
        mismatchReason: { type: string, nullable: true }
    InvoiceData:
      type: object
      properties:
        number: { type: string, nullable: true, example: "F001-000123" }
        date: { type: string, format: date, nullable: true }
        amount:
          {
            type: string,
            nullable: true,
            example: "1250.50",
            description: Decimal string with two decimals.,
          }
        mismatchReason: { type: string, nullable: true }
    Task6Data:
      type: object
      description: "Task 6: four invoices. Expected amounts: Toyota = final Toyota amount, commission = final commission, accessories = accessory amount, release processing = release amount."
      properties:
        toyota: { $ref: "#/components/schemas/InvoiceData" }
        commission: { $ref: "#/components/schemas/InvoiceData" }
        accessories: { $ref: "#/components/schemas/InvoiceData" }
        releaseProcessing: { $ref: "#/components/schemas/InvoiceData" }
    Task8Data:
      type: object
      description: "Task 8: customs."
      properties:
        damNumber: { type: string, nullable: true }
        customsOffice:
          { type: string, enum: [callao_maritima, chancay], nullable: true }
        controlChannel:
          { type: string, enum: [green, orange, red], nullable: true }
    Task9Data:
      type: object
      description: "Task 9: the release process."
      properties:
        personInCharge: { type: string, nullable: true }
    Task10Data:
      type: object
      description: "Task 10: registration."
      properties:
        licensePlate:
          {
            type: string,
            nullable: true,
            description: 6 alphanumeric characters.,
          }
        registrationDate: { type: string, format: date, nullable: true }
    Task11Data:
      type: object
      description: "Task 11: the transfer to the PDS."
      properties:
        pdsTransferDate: { type: string, format: date, nullable: true }
    Task12Data:
      type: object
      description: "Task 12: equipment installation."
      properties:
        serviceOrderNumber: { type: string, nullable: true }
        equipmentCompletionDate: { type: string, format: date, nullable: true }
    Task13Data:
      type: object
      description: "Task 13: delivery. The Surquillo transfer date is optional."
      properties:
        surquilloTransferDate: { type: string, format: date, nullable: true }
        deliveryDate: { type: string, format: date, nullable: true }
    AnalyticsMeta:
      type: object
      required:
        [from, to, previousFrom, previousTo, granularity, scope, generatedAt]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        previousFrom: { type: string, format: date }
        previousTo: { type: string, format: date }
        granularity:
          type: string
          enum: [day, week, month]
          description: Bucket size of the trends - day up to 31 days, week up to 180 days, month beyond.
        scope:
          type: string
          enum: [global, own]
          description: own when the figures cover only the caller's sales (an Advisor).
        generatedAt: { type: string, format: date-time }
    CountMetric:
      type: object
      required: [value, previous]
      properties:
        value: { type: integer }
        previous:
          {
            type: integer,
            description: The same figure for the previous period.,
          }
    MoneyMetric:
      type: object
      required: [value, previous]
      description: USD amounts as decimal text with two decimals.
      properties:
        value: { type: string, example: "125000.00" }
        previous: { type: string, example: "98000.00" }
    RateMetric:
      type: object
      required: [value, previous]
      description: A ratio from 0 to 1; null when the denominator is zero.
      properties:
        value: { type: number, nullable: true }
        previous: { type: number, nullable: true }
    Ratio:
      type: object
      required: [numerator, denominator, value]
      description: A ratio with its parts, so the screen can show how it was calculated. value is null when the denominator is zero.
      properties:
        numerator: { type: integer }
        denominator: { type: integer }
        value: { type: number, nullable: true }
    RatioMetric:
      type: object
      required: [numerator, denominator, value, previous]
      properties:
        numerator: { type: integer }
        denominator: { type: integer }
        value: { type: number, nullable: true }
        previous: { type: number, nullable: true }
    ValueTotal:
      type: object
      required: [amount, saleCount]
      properties:
        amount: { type: string }
        saleCount: { type: integer }
    ValuedTotal:
      type: object
      required: [amount, saleCount, estimatedCount]
      properties:
        amount: { type: string }
        saleCount: { type: integer }
        estimatedCount:
          type: integer
          description: How many of the sales use the catalog reference price because no quoted final price exists yet.
    AnalyticsOverview:
      type: object
      required: [meta, snapshot, period, money, pipeline, trend, attention]
      properties:
        meta: { $ref: "#/components/schemas/AnalyticsMeta" }
        snapshot:
          type: object
          required: [activeSales, overdue, approaching, idle]
          description: The situation now. Overdue, approaching and idle are counted over active sales and never overlap (a sale has one current task).
          properties:
            activeSales: { type: integer }
            overdue:
              {
                type: integer,
                description: The in-progress task is past its due date.,
              }
            approaching:
              {
                type: integer,
                description: The in-progress task is past 80% of its recommended duration but not overdue.,
              }
            idle:
              type: integer
              description: No task is in progress and the next one has been eligible for more than 24 hours.
        period:
          type: object
          required: [created, completed, cancelled, closeRate, cycleTime]
          properties:
            created: { $ref: "#/components/schemas/CountMetric" }
            completed: { $ref: "#/components/schemas/CountMetric" }
            cancelled: { $ref: "#/components/schemas/CountMetric" }
            closeRate:
              allOf: [{ $ref: "#/components/schemas/RatioMetric" }]
              description: Completed divided by completed plus cancelled, among sales resolved in the period.
            cycleTime:
              type: object
              required: [medianHours, p90Hours, previousMedianHours, sampleSize]
              description: Sale creation to completion, for sales completed in the period.
              properties:
                medianHours: { type: number, nullable: true }
                p90Hours: { type: number, nullable: true }
                previousMedianHours: { type: number, nullable: true }
                sampleSize: { type: integer }
        money:
          type: object
          required:
            [
              pipelineValue,
              pendingCollection,
              completedValue,
              averageTicket,
              collected,
              invoiced,
              lostValue,
              internal,
            ]
          properties:
            pipelineValue:
              allOf: [{ $ref: "#/components/schemas/ValuedTotal" }]
              description: Value of the active sales (snapshot).
            pendingCollection:
              allOf: [{ $ref: "#/components/schemas/ValueTotal" }]
              description: Quoted final price of active sales whose task 4 (payment to Grupo Pana) is not completed (snapshot). Sales without a quoted price yet are left out.
            completedValue:
              allOf: [{ $ref: "#/components/schemas/MoneyMetric" }]
              description: Quoted final price of the sales completed in the period.
            averageTicket:
              type: object
              required: [value, previous]
              description: Average quoted final price of the sales completed in the period; null when there are none.
              properties:
                value: { type: string, nullable: true }
                previous: { type: string, nullable: true }
            collected:
              allOf: [{ $ref: "#/components/schemas/MoneyMetric" }]
              description: Deposited amounts recorded in task 4 whose payment date falls in the period, on sales that are not cancelled.
            invoiced:
              allOf: [{ $ref: "#/components/schemas/MoneyMetric" }]
              description: Invoice amounts recorded in task 6 whose invoice date falls in the period, on sales that are not cancelled.
            lostValue:
              allOf: [{ $ref: "#/components/schemas/ValuedTotal" }]
              description: Value of the sales cancelled in the period.
            internal:
              nullable: true
              description: Manager and Admin only; null for an Advisor.
              allOf: [{ $ref: "#/components/schemas/InternalMoney" }]
        pipeline:
          type: array
          description: One entry per milestone (1 to 6), in order, counting active sales by the milestone of their current task.
          items: { $ref: "#/components/schemas/MilestoneLoad" }
        trend:
          type: array
          description: Counts per bucket of the period, oldest first, including empty buckets.
          items:
            type: object
            required: [bucket, created, completed, cancelled]
            properties:
              bucket:
                {
                  type: string,
                  format: date,
                  description: First day of the bucket.,
                }
              created: { type: integer }
              completed: { type: integer }
              cancelled: { type: integer }
        attention:
          type: object
          required: [total, items]
          properties:
            total:
              {
                type: integer,
                description: How many active sales need attention; items shows the first ten.,
              }
            items:
              type: array
              maxItems: 10
              description: Overdue first (most late first), then approaching, then idle (longest first).
              items: { $ref: "#/components/schemas/AttentionItem" }
    InternalMoney:
      type: object
      required:
        [
          commissionFinal,
          commissionRate,
          commissionPipeline,
          commissionDrift,
          paidToToyota,
          amountMismatches,
        ]
      properties:
        commissionFinal:
          allOf: [{ $ref: "#/components/schemas/MoneyMetric" }]
          description: Final commission (task 3) of the sales completed in the period.
        commissionRate:
          allOf: [{ $ref: "#/components/schemas/RateMetric" }]
          description: Final commission divided by quoted final price, over the same completed sales.
        commissionPipeline:
          allOf: [{ $ref: "#/components/schemas/ValueTotal" }]
          description: Initial commission (task 1) of the active sales that have one (snapshot).
        commissionDrift:
          type: string
          description: Final commission minus initial commission, summed over the sales completed in the period. Negative when commissions fell between quotation and settlement.
        paidToToyota:
          allOf: [{ $ref: "#/components/schemas/MoneyMetric" }]
          description: Deposited amounts recorded in task 5 whose payment date falls in the period, on sales that are not cancelled.
        amountMismatches:
          type: object
          required: [count, absoluteDifference]
          description: Payments and invoices dated in the period whose recorded amount differs from the expected one (each has a written reason).
          properties:
            count: { type: integer }
            absoluteDifference: { type: string }
    MilestoneLoad:
      type: object
      required:
        [
          milestoneNumber,
          name,
          active,
          onTime,
          approaching,
          overdue,
          idle,
          value,
        ]
      properties:
        milestoneNumber: { type: integer, minimum: 1, maximum: 6 }
        name: { type: string }
        active: { type: integer }
        onTime: { type: integer }
        approaching: { type: integer }
        overdue: { type: integer }
        idle: { type: integer }
        value:
          {
            type: string,
            description: Value of the sales in this milestone,
            as defined in the endpoint.,
          }
    AttentionItem:
      type: object
      required:
        [
          saleId,
          code,
          customerName,
          vehicle,
          advisorName,
          taskNumber,
          taskName,
          reason,
          dueDate,
          hours,
          value,
        ]
      properties:
        saleId: { type: string, format: uuid }
        code: { type: string }
        customerName: { type: string }
        vehicle: { type: string, description: Model and version. }
        advisorName: { type: string }
        taskNumber: { type: integer, minimum: 1, maximum: 13 }
        taskName: { type: string }
        reason: { type: string, enum: [overdue, approaching, idle] }
        dueDate: { type: string, format: date-time, nullable: true }
        hours:
          type: number
          description: Hours past the due date for overdue, hours until the due date for approaching, hours waiting for idle.
        value: { type: string, nullable: true }
    AnalyticsProcess:
      type: object
      required: [meta, onTimeRate, tasks, customs]
      properties:
        meta: { $ref: "#/components/schemas/AnalyticsMeta" }
        onTimeRate:
          allOf: [{ $ref: "#/components/schemas/RatioMetric" }]
          description: Tasks with a recommended duration completed early or while approaching, divided by all of them, completed in the period.
        tasks:
          type: array
          description: One entry per task, 1 to 13.
          items: { $ref: "#/components/schemas/TaskTiming" }
        customs:
          type: array
          description: Task 8 completed in the period, by control channel.
          items:
            type: object
            required: [channel, count, workMedianHours]
            properties:
              channel: { type: string, enum: [green, orange, red] }
              count: { type: integer }
              workMedianHours: { type: number, nullable: true }
    TaskTiming:
      type: object
      required:
        [
          taskNumber,
          name,
          milestoneNumber,
          recommendedHours,
          completedCount,
          workMedianHours,
          workP90Hours,
          waitMedianHours,
          deadlines,
          currentCount,
          overdueCount,
          reworkCount,
        ]
      properties:
        taskNumber: { type: integer, minimum: 1, maximum: 13 }
        name: { type: string }
        milestoneNumber: { type: integer, minimum: 1, maximum: 6 }
        recommendedHours: { type: integer, nullable: true }
        completedCount: { type: integer }
        workMedianHours: { type: number, nullable: true }
        workP90Hours: { type: number, nullable: true }
        waitMedianHours: { type: number, nullable: true }
        deadlines:
          nullable: true
          description: Completion phases of the tasks completed in the period; null for tasks without a recommended duration.
          type: object
          required: [early, inApproaching, overdue, recurringOverdue]
          properties:
            early: { type: integer }
            inApproaching: { type: integer }
            overdue: { type: integer }
            recurringOverdue: { type: integer }
        currentCount:
          {
            type: integer,
            description: Active sales whose current task is this one (snapshot).,
          }
        overdueCount:
          {
            type: integer,
            description: Of those,
            how many are past due (snapshot).,
          }
        reworkCount: { type: integer }
    AnalyticsCommercial:
      type: object
      required:
        [
          meta,
          vehicles,
          customerTypes,
          temperatures,
          cancellations,
          valueTrend,
          priceComposition,
          invoicedByKind,
        ]
      properties:
        meta: { $ref: "#/components/schemas/AnalyticsMeta" }
        vehicles:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/VehicleGroup" }
        customerTypes:
          type: array
          items: { $ref: "#/components/schemas/CustomerTypeGroup" }
        temperatures:
          type: array
          description: Hot, warm and cold, always three entries. Tests how well the temperature chosen at creation predicts the outcome.
          items:
            type: object
            required:
              [
                temperature,
                created,
                completed,
                cancelled,
                inProgress,
                closeRate,
              ]
            properties:
              temperature: { $ref: "#/components/schemas/SaleTemperature" }
              created: { type: integer }
              completed: { type: integer }
              cancelled: { type: integer }
              inProgress: { type: integer }
              closeRate: { $ref: "#/components/schemas/Ratio" }
        cancellations:
          type: object
          required: [total, byCategory, byTask]
          description: Sales cancelled in the period.
          properties:
            total: { $ref: "#/components/schemas/ValuedTotal" }
            byCategory:
              type: array
              items:
                type: object
                required: [category, count, value]
                properties:
                  category:
                    { $ref: "#/components/schemas/CancellationCategory" }
                  count: { type: integer }
                  value: { type: string }
            byTask:
              type: array
              description: The task the sale was on when it was cancelled.
              items:
                type: object
                required: [taskNumber, name, count]
                properties:
                  taskNumber: { type: integer, minimum: 1, maximum: 13 }
                  name: { type: string }
                  count: { type: integer }
        valueTrend:
          type: array
          description: Money per bucket, oldest first, including empty buckets.
          items:
            type: object
            required: [bucket, createdValue, completedValue, commission]
            properties:
              bucket: { type: string, format: date }
              createdValue:
                {
                  type: string,
                  description: Value of the sales created in the bucket.,
                }
              completedValue:
                {
                  type: string,
                  description: Quoted final price of the sales completed in the bucket.,
                }
              commission:
                {
                  type: string,
                  nullable: true,
                  description: Final commission of the sales completed in the bucket. Manager and Admin only.,
                }
        priceComposition:
          nullable: true
          description: Manager and Admin only. Where the quoted final price of the sales completed in the period goes.
          type: object
          required:
            [toyota, commission, accessories, releaseProcessing, saleCount]
          properties:
            toyota:
              { type: string, description: Final amount to Toyota (task 3). }
            commission: { type: string }
            accessories: { type: string }
            releaseProcessing: { type: string }
            saleCount: { type: integer }
        invoicedByKind:
          type: array
          description: Invoices dated in the period on sales that are not cancelled.
          items:
            type: object
            required: [kind, count, amount]
            properties:
              kind:
                {
                  type: string,
                  enum: [toyota, commission, accessories, release_processing],
                }
              count: { type: integer }
              amount: { type: string }
    VehicleGroup:
      type: object
      required:
        [
          key,
          label,
          created,
          completed,
          cancelled,
          active,
          quotedValue,
          averageTicket,
          commission,
        ]
      properties:
        key:
          {
            type: string,
            description: The id of the model,
            version or color,
            or the category value.,
          }
        label:
          {
            type: string,
            description: The name; for a category the enum value,
            which the screen translates.,
          }
        created: { type: integer }
        completed: { type: integer }
        cancelled: { type: integer }
        active: { type: integer }
        quotedValue:
          {
            type: string,
            description: Value of the sales created in the period that are not cancelled.,
          }
        averageTicket:
          {
            type: string,
            nullable: true,
            description: Average quoted final price of the completed sales.,
          }
        commission:
          {
            type: string,
            nullable: true,
            description: Final commission of the completed sales. Manager and Admin only.,
          }
    CustomerTypeGroup:
      type: object
      required:
        [
          customerType,
          created,
          completed,
          cancelled,
          active,
          closeRate,
          quotedValue,
          commission,
        ]
      properties:
        customerType: { $ref: "#/components/schemas/CustomerType" }
        created: { type: integer }
        completed: { type: integer }
        cancelled: { type: integer }
        active: { type: integer }
        closeRate: { $ref: "#/components/schemas/Ratio" }
        quotedValue: { type: string }
        commission:
          { type: string, nullable: true, description: Manager and Admin only. }
    AnalyticsTeam:
      type: object
      required: [meta, advisors]
      properties:
        meta: { $ref: "#/components/schemas/AnalyticsMeta" }
        advisors:
          type: array
          items: { $ref: "#/components/schemas/AdvisorPerformance" }
    AdvisorPerformance:
      type: object
      required:
        [
          advisorId,
          name,
          isActive,
          active,
          overdue,
          idle,
          created,
          completed,
          cancelled,
          closeRate,
          cycleMedianHours,
          onTimeRate,
          pipelineValue,
          completedValue,
          commission,
        ]
      properties:
        advisorId: { type: string, format: uuid }
        name: { type: string }
        isActive: { type: boolean }
        active: { type: integer, description: Snapshot. }
        overdue: { type: integer, description: Snapshot. }
        idle: { type: integer, description: Snapshot. }
        created: { type: integer }
        completed: { type: integer }
        cancelled: { type: integer }
        closeRate: { $ref: "#/components/schemas/Ratio" }
        cycleMedianHours: { type: number, nullable: true }
        onTimeRate: { $ref: "#/components/schemas/Ratio" }
        pipelineValue:
          {
            type: string,
            description: Value of the advisor's active sales (snapshot).,
          }
        completedValue:
          {
            type: string,
            description: Quoted final price of the sales completed in the period.,
          }
        commission:
          {
            type: string,
            description: Final commission of the sales completed in the period.,
          }
    AnalyticsSystem:
      type: object
      required: [meta, notifications, security, accounts, storage]
      properties:
        meta: { $ref: "#/components/schemas/AnalyticsMeta" }
        notifications:
          type: object
          required: [pending, sent, failed, skipped, failedByType]
          description: Emails queued in the period (pending is the current backlog).
          properties:
            pending: { type: integer }
            sent: { type: integer }
            failed: { type: integer }
            skipped: { type: integer }
            failedByType:
              type: array
              items:
                type: object
                required: [type, count]
                properties:
                  type: { type: string }
                  count: { type: integer }
        security:
          type: object
          required: [successfulSignIns, failedSignIns, lockedAccounts]
          properties:
            successfulSignIns: { type: integer }
            failedSignIns: { type: integer }
            lockedAccounts:
              { type: integer, description: Employees locked now. }
        accounts:
          type: object
          required: [activeEmployees, notActivatedEmployees]
          properties:
            activeEmployees: { type: integer }
            notActivatedEmployees:
              {
                type: integer,
                description: Active accounts that have not set a password yet.,
              }
        storage:
          type: object
          required: [pendingDeletions]
          properties:
            pendingDeletions:
              {
                type: integer,
                description: Files whose deletion failed and is waiting for a retry.,
              }
