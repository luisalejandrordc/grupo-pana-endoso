        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Catalog]
      operationId: deleteVehicleModel
      summary: Permanently delete a model that no sale uses (Admin)
      description: Exceptional. Removes its versions, colors and images. A model any sale references must be archived instead.
      security:
        - bearerAuth: []
      parameters:
        - name: reason
          in: query
