openapi: 3.0.3
info:
  title: EndosoFlow API
  version: 0.1.0
  description: |
    The contract between the EndosoFlow backend and its frontends. It is the source of truth: a Go test fails
    when a route exists in the code but not here, or here but not in the code.

    **Conventions.** JSON over HTTPS under `/api/v1`. Fields are camelCase. Identifiers are UUIDs. Timestamps are
    ISO 8601 in UTC and calendar dates are `YYYY-MM-DD`. Lists use `page` and `pageSize` (default 20, maximum 100).
    Editable resources carry a `version`; an update must send the version it read.

    **Errors.** Every failure uses the same envelope with a stable English `code` and a Spanish `message` that is
    safe to show. Codes used so far: INVALID_JSON, INVALID_QUERY, VALIDATION_FAILED, VERSION_REQUIRED,
    VERSION_CONFLICT, INVALID_CREDENTIALS, SESSION_INVALID, ACCESS_TOKEN_INVALID, CSRF_REJECTED, FORBIDDEN,
    INVALID_LINK, PASSWORD_TOO_WEAK, INVALID_CURRENT_PASSWORD, RATE_LIMITED, EMPLOYEE_NOT_FOUND,
    EMPLOYEE_ALREADY_EXISTS, EMPLOYEE_EMAIL_ALREADY_USED, EMPLOYEE_ALREADY_ACTIVATED, EMPLOYEE_ALREADY_ACTIVE,
    EMPLOYEE_ALREADY_INACTIVE, EMPLOYEE_HAS_HISTORY, CANNOT_DEACTIVATE_SELF, CANNOT_DELETE_SELF,
    ADVISOR_HAS_ACTIVE_SALES, LAST_ADMIN_PROTECTED, REASON_REQUIRED, ROUTE_NOT_FOUND, METHOD_NOT_ALLOWED,
    CUSTOMER_NOT_FOUND, CUSTOMER_ALREADY_EXISTS, CUSTOMER_ALREADY_ACTIVE, CUSTOMER_ALREADY_INACTIVE,
    CUSTOMER_HAS_SALES, IDENTITY_NOT_FOUND, LOOKUP_NOT_SUPPORTED, LOOKUP_QUOTA_EXHAUSTED, LOOKUP_UNAVAILABLE,
    MODEL_NOT_FOUND, VERSION_NOT_FOUND, COLOR_NOT_FOUND, IMAGE_NOT_FOUND, MODEL_NAME_ALREADY_USED,
    VERSION_NAME_ALREADY_USED, COLOR_NAME_ALREADY_USED, CATALOG_ENTRY_ALREADY_ARCHIVED,
    CATALOG_ENTRY_ALREADY_ACTIVE, CATALOG_ENTRY_IN_USE, CATALOG_INCOMPLETE, LAST_ACTIVE_VERSION,
    LAST_ACTIVE_COLOR, MAIN_IMAGE_REQUIRED, IMAGE_REQUIRED, IMAGE_TOO_LARGE, IMAGE_TYPE_NOT_ALLOWED,
    INVALID_MULTIPART, STORAGE_UNAVAILABLE, SALE_NOT_FOUND, TASK_NOT_FOUND, SALE_NOT_ACTIVE, SALE_NOT_CANCELLED,
    SALE_INVALID_STATE, CUSTOMER_INACTIVE, VEHICLE_NOT_SELECTABLE, VEHICLE_COLOR_MISMATCH, INVALID_ADVISOR,
    ADVISOR_MISMATCH, SAME_ADVISOR, CANCEL_NOT_ALLOWED, REOPEN_NOT_ALLOWED, TASK_INVALID_STATE,
    TASK_NOT_IN_PROGRESS, TASK_NOT_ELIGIBLE, TASK_ALREADY_IN_PROGRESS, TASK_NOT_LAST_COMPLETED,
    DOCUMENTS_UNAVAILABLE, DOCUMENT_REQUIRED, DOCUMENT_PAIR_REQUIRED, INVALID_DOCUMENT, INVALID_AMOUNT,
    INVALID_DATE, COMMISSION_NOT_POSITIVE, MISMATCH_REASON_REQUIRED, INVOICE_NUMBER_INVALID, VIN_INVALID,
    PLATE_INVALID, REASON_TOO_LONG,
    INTERNAL_ERROR.

    **Authentication.** Employees sign in with `POST /auth/employee/login` and send the returned access token as
    `Authorization: Bearer <token>`. The refresh token lives in an HttpOnly cookie. Refresh and logout also need the
    header `X-Requested-With: EndosoFlow`.
servers:
  - url: /api/v1
tags:
  - name: System
  - name: Authentication
  - name: Staff
  - name: Customers
  - name: Catalog
  - name: Sales
  - name: Tasks
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness and database check
      security: []
      responses:
        "200":
          description: The service and its database respond.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: The database does not respond.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /auth/employee/login:
    post:
      tags: [Authentication]
      operationId: employeeLogin
      summary: Sign in as an employee
      description: Every failure (unknown account, wrong password, locked, inactive, not activated) answers INVALID_CREDENTIALS.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in. The refresh token is set as an HttpOnly cookie.
          headers:
            Set-Cookie:
              description: The refresh cookie (ef_employee_refresh), scoped to /api/v1/auth.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Rotate the refresh token and get a new access token
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: A new access token. The cookie is rotated, except inside the 10-second grace window.
          headers:
            Set-Cookie:
              description: The rotated refresh cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End the current session
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Signed out and the cookie cleared.
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/activate:
    post:
      tags: [Authentication]
      operationId: activateAccount
      summary: Set the first password from an activation link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenPasswordRequest" }
      responses:
        "204":
          description: The password was set. The person can now sign in.
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/forgot-password:
    post:
      tags: [Authentication]
      operationId: forgotPassword
      summary: Ask for a password reset link
      description: Always answers 202, whether or not the account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/reset-password:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Set a new password from a reset link
      description: Every session of the account ends.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenPasswordRequest" }
      responses:
        "204":
          description: The password was changed.
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /me:
    get:
      tags: [Authentication]
      operationId: getMe
      summary: The signed-in employee
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/password:
    put:
      tags: [Authentication]
      operationId: changePassword
      summary: Change the signed-in employee's password
      description: Every session of the account ends, including this one.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204":
          description: The password was changed and the cookie cleared.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /employees:
    get:
      tags: [Staff]
      operationId: listEmployees
      summary: List employees (Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Matches names (ignoring accents and case), the start of a document number or of an email.
          schema: { type: string }
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - name: status
          in: query
          schema: { type: string, enum: [all, active, inactive], default: all }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          schema:
            {
              type: string,
              enum: [lastName, "-lastName", createdAt, "-createdAt"],
              default: lastName,
            }
      responses:
        "200":
          description: One page of employees.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Staff]
      operationId: createEmployee
      summary: Create an employee and send the activation link (Admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEmployeeRequest" }
      responses:
        "201":
          description: Created. activationLinkIssued is false if the link could not be issued; resend it later.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateEmployeeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /employees/{id}:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    get:
      tags: [Staff]
      operationId: getEmployee
      summary: Read an employee (Admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The employee.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Staff]
      operationId: updateEmployee
      summary: Edit an employee, including the role (Admin)
      description: Only the fields sent change. version is required; a stale version answers VERSION_CONFLICT.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEmployeeRequest" }
      responses:
        "200":
          description: The updated employee.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Staff]
      operationId: deleteEmployee
      summary: Permanently delete an employee without history (Admin)
      description: Exceptional. Anyone who ever signed in or acted must be deactivated instead.
      security:
        - bearerAuth: []
      parameters:
        - name: reason
          in: query
          required: true
          description: Why the employee is being deleted. It is kept in the audit trail.
          schema: { type: string, minLength: 1 }
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /employees/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    post:
      tags: [Staff]
      operationId: deactivateEmployee
      summary: Deactivate an employee and end their sessions (Admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The deactivated employee.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /employees/{id}/reactivate:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    post:
      tags: [Staff]
      operationId: reactivateEmployee
      summary: Reactivate an employee (Admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The reactivated employee.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /employees/{id}/resend-activation:
    parameters:
      - $ref: "#/components/parameters/EmployeeId"
    post:
      tags: [Staff]
      operationId: resendActivation
      summary: Send a new activation link (Admin)
      description: Only for employees who have not set a password yet.
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /advisors:
    get:
      tags: [Staff]
      operationId: listAdvisors
      summary: Active Sales Advisors for pickers (Admin, Manager)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The active advisors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdvisorList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: List customers in the caller's scope
      description: |
        Admins and Managers see every customer. An Advisor sees the customers with at least one sale currently
        assigned to them, plus the customers they created that have no sale yet.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Matches names (ignoring accents and case), the start of a document number or of an email.
          schema: { type: string }
        - name: customerType
          in: query
          schema: { $ref: "#/components/schemas/CustomerType" }
        - name: status
          in: query
          schema: { type: string, enum: [all, active, inactive], default: all }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          schema:
            {
              type: string,
              enum: [displayName, "-displayName", createdAt, "-createdAt"],
              default: displayName,
            }
      responses:
        "200":
          description: One page of customers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      description: |
        A Diplomático (person) needs first name, last name and gender and a DNI, CE, PAS or CDI. An organization
        needs a legal name plus a contact's first name, last name and job title and a RUC. The pair (document type,
        number) is unique. Fields that do not apply to the type are ignored. The portal status starts as not_invited.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /customers/lookup:
    get:
      tags: [Customers]
      operationId: lookupCustomer
      summary: Check whether a customer exists for a document
      description: |
        Admins and Managers get the full record. An Advisor who is not linked to the customer gets the legal name
        only (access name_only) and never learns about the customer's sales. Every lookup is logged and each
        employee is limited per minute.
      security:
        - bearerAuth: []
      parameters:
        - name: documentType
          in: query
          required: true
          schema: { $ref: "#/components/schemas/CustomerDocumentType" }
        - name: documentNumber
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The lookup result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerLookupResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /customers/{id}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Read a customer in the caller's scope
      description: A customer outside an Advisor's scope answers 404, as if it did not exist.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Edit a customer in the caller's scope
      description: |
        Only the fields sent change. version is required; a stale version answers VERSION_CONFLICT. Editing a name
        without sending nameSource marks it as manual. Existing sale snapshots never change.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCustomerRequest" }
      responses:
        "200":
          description: The updated customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Customers]
      operationId: deleteCustomer
      summary: Permanently delete a customer without sales (Admin)
      description: Exceptional. A customer with any sale must be deactivated instead.
      security:
        - bearerAuth: []
      parameters:
        - name: reason
          in: query
          required: true
          description: Why the customer is being deleted. It is kept in the audit trail.
          schema: { type: string, minLength: 1 }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /customers/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    post:
      tags: [Customers]
      operationId: deactivateCustomer
      summary: Deactivate a customer (Admin, Manager)
      description: An inactive customer cannot receive new sales or portal access. History is kept.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The deactivated customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /customers/{id}/reactivate:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    post:
      tags: [Customers]
      operationId: reactivateCustomer
      summary: Reactivate a customer (Admin, Manager)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The reactivated customer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /lookups/identity:
    get:
      tags: [Customers]
      operationId: lookupIdentity
      summary: Fill a name from a DNI or RUC (Codart)
      description: |
        Only DNI and RUC are supported; CE, PAS and CDI are always typed by hand. A customer we already have is
        answered from our database (source database) and costs no provider call. Otherwise the request counts
        against a per-minute limit and the monthly Codart quota (110) before the provider is called. When this
        fails for any reason (404, 409, 429, 503), the client unlocks manual entry.
      security:
        - bearerAuth: []
      parameters:
        - name: documentType
          in: query
          required: true
          schema: { type: string, enum: [DNI, RUC] }
        - name: documentNumber
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The name data found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: The provider is unavailable or not configured (LOOKUP_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /lookups/identity/quota:
    get:
      tags: [Customers]
      operationId: getIdentityQuota
      summary: Codart usage this month, Lima time (Admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The monthly usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityQuota" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /vehicle-models:
    get:
      tags: [Catalog]
      operationId: listVehicleModels
      summary: List vehicle models
      description: Admins and Managers see archived models too. An Advisor always gets active models only.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Matches the model name, ignoring accents and case.
          schema: { type: string }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/VehicleCategory" }
        - name: status
          in: query
          schema: { type: string, enum: [all, active, archived], default: all }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          schema:
            {
              type: string,
              enum: [name, "-name", createdAt, "-createdAt"],
              default: name,
            }
      responses:
        "200":
          description: One page of models.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehicleModelList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Catalog]
      operationId: createVehicleModel
      summary: Create a model with its first version, color and Main view image (Admin, Manager)
      description: |
        Sent as multipart/form-data with a JSON part called data and a file part called mainImage. A model cannot
        exist without a version, a color and that color's Main view image, so all of it is saved at once or not at
        all. The price may be a JSON number or a string; it is stored with two decimals. Images must be JPEG, PNG
        or WebP and at most 5 MB; the type is decided from the file's bytes, not from what the client says.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CreateVehicleModelMultipart" }
            encoding:
              data: { contentType: application/json }
              mainImage: { contentType: "image/jpeg, image/png, image/webp" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehicleModel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413":
          description: The image is larger than 5 MB (IMAGE_TOO_LARGE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503":
          description: The file store is unavailable (STORAGE_UNAVAILABLE). Nothing was saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /vehicle-models/{id}:
    parameters:
      - $ref: "#/components/parameters/VehicleModelId"
    get:
      tags: [Catalog]
      operationId: getVehicleModel
      summary: Read a model with its versions, colors and images
      description: An Advisor gets it only while it is active, and without archived versions and colors.
      security:
