  /sales:
    get:
      tags: [Sales]
      operationId: listSales
      summary: The sales workspace
      description: |
        An Advisor only ever gets their own sales, in the list and in the count; the advisorId filter cannot widen
        that. Managers and Admins see every sale. currentTask is the in-progress task or, when none is in
        progress, the lowest task not yet completed; a completed sale has none.
      security:
        - bearerAuth: []
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string },
            description: "Customer name, document, vehicle, series, VIN, plate or sale code.",
          }
        - {
            name: state,
            in: query,
            schema: { $ref: "#/components/schemas/SaleState" },
          }
        - {
            name: currentTask,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 13 },
          }
        - {
            name: milestone,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 6 },
            description: "Sales whose current task belongs to this milestone.",
          }
        - { name: advisorId, in: query, schema: { type: string, format: uuid } }
        - {
            name: customerType,
            in: query,
            schema: { $ref: "#/components/schemas/CustomerType" },
          }
        - {
            name: temperature,
            in: query,
            schema: { $ref: "#/components/schemas/SaleTemperature" },
          }
        - { name: modelId, in: query, schema: { type: string, format: uuid } }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - name: sort
          in: query
          schema:
            {
              type: string,
              enum:
                [
                  "-createdAt",
                  createdAt,
                  customerName,
                  "-customerName",
                  updatedAt,
                  "-updatedAt",
                  dueDate,
                ],
              default: "-createdAt",
            }
      responses:
        "200":
          description: One page of sales.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Sales]
      operationId: createSale
      summary: Start a sale
      description: |
        Records the customer and the vehicle as they are now, creates the 13 pending tasks and assigns the advisor.
        An Advisor creates for themselves; a Manager or Admin must choose an active Advisor. The customer must be
        active and the version and color must be selectable. The customer is notified, and so is an advisor who
        did not create the sale themselves.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSaleRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    get:
      tags: [Sales]
      operationId: getSale
      summary: Read a sale
      description: A sale an Advisor does not own answers 404, as if it did not exist.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The sale with its tasks, milestones and permissions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Sales]
      operationId: updateSaleNotes
      summary: Edit the sale's notes
      description: Notes are the only editable field of a sale besides its advisor. version is required.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSaleNotesRequest" }
      responses:
        "200":
          description: The updated sale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Sales]
      operationId: deleteSale
      summary: Permanently delete a sale that never reached delivery (Admin)
      description: |
        For test and erroneous sales only. The reason and the typed sale code are required. The sale's files leave
        storage after the commit; the audit trail survives. A sale whose task 13 was ever completed cannot be
        deleted, even if that task was reopened.
      security:
        - bearerAuth: []
      parameters:
        - {
            name: reason,
            in: query,
            required: true,
            schema: { type: string, minLength: 1 },
          }
        - {
            name: confirm,
            in: query,
            required: true,
            schema: { type: string },
            description: "The sale code, typed by the person.",
          }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/history:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    get:
      tags: [Sales]
      operationId: getSaleHistory
      summary: The sale's timeline, newest first
      security:
        - bearerAuth: []
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleHistory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sales/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    post:
      tags: [Sales]
      operationId: cancelSale
      summary: Cancel an active sale
      description: |
        An Advisor may cancel their own sale while the current task is 1 to 3, a Manager while it is 1 to 6, an Admin
        at any stage (CANCEL_NOT_ALLOWED otherwise). The category and the reason are both required. The sale and its
        tasks freeze; reminders stop; the series, VIN and plate become free for other sales.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelSaleRequest" }
      responses:
        "200":
          description: The cancelled sale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/reopen:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    post:
      tags: [Sales]
      operationId: reopenSale
      summary: Reopen a cancelled sale (Manager, Admin)
      description: |
        A Manager only if it was cancelled while the current task was 1 to 6; an Admin always (REOPEN_NOT_ALLOWED
        otherwise). The in-progress task's start time and due date move forward by the time the sale spent cancelled.
        If another sale took its series, VIN or plate meanwhile, the reopen is refused with that conflict.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: The reopened sale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/reassign:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    post:
      tags: [Sales]
      operationId: reassignSale
      summary: Hand an active sale to another Advisor (Manager, Admin)
      description: The customer, the new advisor and the previous advisor are notified.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReassignSaleRequest" }
      responses:
        "200":
          description: The reassigned sale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/tasks:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    get:
      tags: [Tasks]
      operationId: listSaleTasks
      summary: The 13 tasks of a sale
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The tasks in order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TaskSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sales/{id}/tasks/{number}:
    parameters:
      - $ref: "#/components/parameters/SaleId"
      - $ref: "#/components/parameters/TaskNumber"
    get:
      tags: [Tasks]
      operationId: getSaleTask
      summary: One task with its data, calculated values, documents, warnings and the actions available
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sales/{id}/tasks/{number}/start:
    parameters:
      - $ref: "#/components/parameters/SaleId"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: startTask
      summary: Start the eligible task
      description: |
        A task is eligible when the previous one is completed and none is in progress. Starting sets the due date
        when the task has an SLA. An Advisor acts only on their own sale.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The started task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /sales/{id}/tasks/{number}/complete:
    parameters:
      - $ref: "#/components/parameters/SaleId"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: completeTask
      summary: Complete the task in progress
      description: |
        Every missing field and required document is reported at once (TASK_INCOMPLETE, with the fields). An amount
        that differs from the expected one needs a reason. Completing task 13 completes the sale. Customers are
        notified at the milestone tasks (1, 3, 6, 7, 10, 11, 13), never twice for the same task.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The completed task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/tasks/{number}/restart:
    parameters:
      - $ref: "#/components/parameters/SaleId"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: restartTask
      summary: Put the task in progress back to pending (Manager, Admin)
      description: Clears its clock and reminders. The data and files already saved are kept, read-only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: The restarted task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/tasks/{number}/reopen:
    parameters:
      - $ref: "#/components/parameters/SaleId"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: reopenTask
      summary: Reopen the last completed task (Manager, Admin)
      description: |
        Only the last completed task, and only when no task is in progress. It keeps its original start time and due
        date. Reopening task 13 of a completed sale makes the sale active again.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: The reopened task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/tasks/{number}/data:
    parameters:
      - $ref: "#/components/parameters/SaleId"
      - $ref: "#/components/parameters/TaskNumber"
    patch:
      tags: [Tasks]
      operationId: saveTaskData
      summary: Save the fields of a task
      description: |
        While the task is in progress an Advisor on their own sale (or a Manager or Admin) saves a draft: a field that
        is absent is left alone, an empty string clears it. A completed task can only be corrected by a Manager or
        Admin with a written reason, and the correction must leave it complete. Impossible values are refused;
        out-of-order dates only warn. version (the task's) is required. A pending task is read-only.
        Financial fields lock once a later task that depends on them is completed
        (TASK_FINANCIAL_FIELD_LOCKED). Identifiers must be unique among active and completed sales.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveTaskDataRequest" }
      responses:
        "200":
          description: The task after saving, with its warnings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/tasks/{number}/notes:
    parameters:
      - $ref: "#/components/parameters/SaleId"
      - $ref: "#/components/parameters/TaskNumber"
    patch:
      tags: [Tasks]
      operationId: saveTaskNotes
      summary: Save the free-text notes of a task
      description: |
        Notes have no version: the last save wins, and saving them does not change the task's `version`, so a data
        form that is open never goes stale because of a note. An Advisor writes notes only while the task is in
        progress; a Manager or Admin on any task of a sale that is not cancelled. The history records that the notes
        changed, never their text.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveTaskNotesRequest" }
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/documents:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    get:
      tags: [Documents]
      operationId: listSaleDocuments
      summary: Every document slot of a sale with its current file
      description: |
        One entry per slot, in task order. `required` says whether the task engine needs the slot for this sale's
        customer type (the power of attorney is not required for a Diplomático). A sale outside an Advisor's scope
        answers 404.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The slots.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentSlotList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sales/{id}/tasks/{number}/documents/{slot}:
    parameters:
      - $ref: "#/components/parameters/SaleId"
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/DocumentSlot"
    put:
      tags: [Documents]
      operationId: uploadSaleDocument
      summary: Upload a file to a slot, replacing the current one
      description: |
        `multipart/form-data` with one `file` part and an optional `reason` text part. The file is checked by its
        content, not its name or declared type: a PDF slot takes only a PDF and an Excel slot only an .xlsx or .xls
        workbook, up to 10 MB (DOCUMENT_TYPE_NOT_ALLOWED, DOCUMENT_TOO_LARGE). While the task is in progress its
        actors (the assigned Advisor, a Manager, an Admin) can upload. On a completed task only a Manager or Admin can
        replace a file, and `reason` is then required. A new file answers 201 and a replacement 200. The replaced
        file is deleted from storage after the change commits.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The file replaced the previous one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentFile" }
        "201":
          description: The file was stored in an empty slot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentFile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413":
          description: The file is larger than 10 MB (DOCUMENT_TOO_LARGE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503":
          description: File storage is not available (STORAGE_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [Documents]
      operationId: removeSaleDocument
      summary: Remove the file of a slot
      description: |
        Allowed only while the task is in progress; a completed task can have a file replaced but never removed. The
        stored file is deleted after the change commits and the removal is audited.
      security:
        - bearerAuth: []
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /documents/{id}/download-url:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Documents]
      operationId: getDocumentDownloadUrl
      summary: A short-lived signed address to download a file
      description: |
        Issued only after the caller's role and scope are checked; a document of a sale outside an Advisor's scope
        answers 404. The address expires after a few minutes and makes the browser save the file under its original
        name. Storage addresses are never exposed in any other way.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The signed address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentDownload" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: File storage is not available (STORAGE_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: ef_employee_refresh
  parameters:
    SaleId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskNumber:
      name: number
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 13 }
    DocumentSlot:
      name: slot
      in: path
      required: true
      description: The slot code, such as quotation_pdf. It must belong to the task in the path.
      schema: { type: string }
    VehicleModelId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VehicleVersionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VehicleColorId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmployeeId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CsrfHeader:
      name: X-Requested-With
      in: header
      required: true
      description: Must be EndosoFlow. A form on another site cannot send it.
      schema: { type: string, enum: [EndosoFlow] }
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing, expired or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The employee's role does not allow this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: The record does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: The request conflicts with the current state (version, uniqueness or a business rule).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unprocessable:
      description: The data breaks a validation or business rule. Field problems are listed in error.fields.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, error] }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: Stable English code. }
            message:
              { type: string, description: Spanish text that is safe to show. }
            fields:
              type: array
              items: { $ref: "#/components/schemas/FieldError" }
            requestId: { type: string }
    Accepted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted] }
    Role:
      type: string
      enum: [system_admin, sales_manager, sales_advisor]
    DocumentType:
      type: string
      enum: [DNI, CE, PAS]
    LoginRequest:
      type: object
      required: [documentType, documentNumber, password]
      properties:
