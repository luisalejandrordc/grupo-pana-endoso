        currentTask:
          {
            allOf: [{ $ref: "#/components/schemas/SaleCurrentTask" }],
            nullable: true,
          }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SaleList:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SaleListItem" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    CreateSaleRequest:
      type: object
      required: [customerId, versionId, colorId, temperature]
      properties:
        customerId: { type: string, format: uuid }
        versionId: { type: string, format: uuid }
        colorId: { type: string, format: uuid }
        temperature: { $ref: "#/components/schemas/SaleTemperature" }
        notes: { type: string, maxLength: 2000 }
        advisorId:
          {
            type: string,
            format: uuid,
            description: Required for a Manager or Admin; absent or the caller's own for an Advisor.,
          }
    UpdateSaleNotesRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer }
        notes:
          {
            type: string,
            maxLength: 2000,
            description: An empty string clears the notes.,
          }
    CancelSaleRequest:
      type: object
      required: [category, reason]
      properties:
        category: { $ref: "#/components/schemas/CancellationCategory" }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    ReassignSaleRequest:
      type: object
      required: [advisorId]
      properties:
        advisorId: { type: string, format: uuid }
        reason: { type: string }
    SaleHistoryEvent:
      type: object
      required: [id, at, actorName, isSystem, entityType, action]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actorName: { type: string }
        isSystem: { type: boolean }
        entityType: { type: string }
        taskNumber: { type: integer, nullable: true }
        action: { type: string }
        reason: { type: string, nullable: true }
        changes: { type: object, additionalProperties: true, nullable: true }
    SaleHistory:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SaleHistoryEvent" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    TaskSummary:
      type: object
      required: [number, name, milestoneNumber, status, isEligible, version]
      properties:
        number: { type: integer }
        name: { type: string }
        milestoneNumber: { type: integer }
        status: { $ref: "#/components/schemas/TaskStatus" }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        dueDate: { type: string, format: date-time, nullable: true }
        completionPhase:
          {
            allOf: [{ $ref: "#/components/schemas/CompletionPhase" }],
            nullable: true,
          }
        recommendedDurationHours: { type: integer, nullable: true }
        isEligible: { type: boolean }
        version: { type: integer }
    DocumentFile:
      type: object
      description: The current file of a slot.
      required:
        [
          id,
          fileName,
          mimeType,
          sizeBytes,
          checksumSha256,
          uploadedById,
          uploadedBy,
          uploadedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        checksumSha256: { type: string }
        uploadedById: { type: string, format: uuid }
        uploadedBy: { type: string }
        uploadedAt: { type: string, format: date-time }
    DocumentSlot:
      type: object
      required:
        [slotCode, taskNumber, label, allowedFormat, customerVisible, required]
      properties:
        slotCode: { type: string }
        taskNumber: { type: integer, minimum: 1, maximum: 13 }
        label: { type: string }
        allowedFormat: { type: string, enum: [pdf, excel] }
        customerVisible:
          {
            type: boolean,
            description: Fixed by the slot; the customer portal shows only these.,
          }
        required:
          {
            type: boolean,
            description: Needed to complete the task for this sale's customer type.,
          }
        file:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DocumentFile"
    DocumentSlotList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DocumentSlot" }
    PhotoLink:
      type: object
      required: [url, expiresAt, mimeType]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        mimeType: { type: string }
    DocumentDownload:
      type: object
      required: [url, expiresAt, fileName, mimeType]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        fileName: { type: string }
        mimeType: { type: string }
    TaskDocumentFile:
      type: object
      required: [id, fileName, mimeType, sizeBytes, uploadedAt, uploadedByName]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        uploadedAt: { type: string, format: date-time }
        uploadedByName: { type: string }
    TaskDocumentSlot:
      type: object
      required: [slotCode, label, allowedFormat, required, customerVisible]
      properties:
        slotCode: { type: string }
        label: { type: string }
        allowedFormat: { type: string }
        required:
          {
            type: boolean,
            description: Already accounts for the customer type (the power of attorney is required unless the customer is a Diplomático).,
          }
        customerVisible: { type: boolean }
        file:
          {
            allOf: [{ $ref: "#/components/schemas/TaskDocumentFile" }],
            nullable: true,
          }
    TaskWarning:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string, enum: [DATE_OUT_OF_ORDER, DATE_IN_THE_FUTURE] }
        message: { type: string }
    TaskPermissions:
      type: object
      required:
        [
          canStart,
          canComplete,
          canEditData,
          needsReason,
          canSaveNotes,
          canRestart,
          canReopen,
          canUploadDocuments,
          canRemoveDocuments,
        ]
      properties:
        canStart: { type: boolean }
        canComplete: { type: boolean }
        canEditData: { type: boolean }
        needsReason:
          {
            type: boolean,
            description: Editing a completed task needs a written reason.,
          }
        canSaveNotes: { type: boolean }
        canRestart: { type: boolean }
        canReopen: { type: boolean }
        canUploadDocuments:
          {
            type: boolean,
            description: Files can be added or replaced wherever the data can be edited.,
          }
        canRemoveDocuments:
          {
            type: boolean,
            description: Files can only be removed while the task is in progress.,
          }
    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/TaskSummary"
        - type: object
          required: [saleId, data, calculated, documents, warnings, permissions]
          properties:
            saleId: { type: string, format: uuid }
            notes: { type: string, nullable: true }
            data:
              description: The task's fields; the shape depends on the task number.
              oneOf:
                - $ref: "#/components/schemas/Task1Data"
                - $ref: "#/components/schemas/Task2Data"
                - $ref: "#/components/schemas/Task3Data"
                - $ref: "#/components/schemas/PaymentData"
                - $ref: "#/components/schemas/Task6Data"
                - $ref: "#/components/schemas/Task8Data"
                - $ref: "#/components/schemas/Task9Data"
                - $ref: "#/components/schemas/Task10Data"
                - $ref: "#/components/schemas/Task11Data"
                - $ref: "#/components/schemas/Task12Data"
                - $ref: "#/components/schemas/Task13Data"
                - { type: object, description: "Task 7 has no fields." }
            calculated:
              type: object
              additionalProperties: true
              description: |
                Values computed from the saved data, never typed in. Task 1: quotedFinalPrice. Task 3: quotedFinalPrice and
                finalCommission. Tasks 4 and 5: expectedAmount and amountsMatch. Task 6: per invoice, expectedAmount and amountsMatch.
            documents:
              type: array
              items: { $ref: "#/components/schemas/TaskDocumentSlot" }
            warnings:
              type: array
              items: { $ref: "#/components/schemas/TaskWarning" }
            permissions: { $ref: "#/components/schemas/TaskPermissions" }
    SaveTaskDataRequest:
      type: object
      required: [version, data]
      properties:
        version:
          { type: integer, description: "The task's version, as last read." }
        reason:
          {
            type: string,
            description: Required when the task is already completed.,
          }
        data:
          description: "The fields to change. Absent fields are left alone; an empty string clears a field. Unknown fields are refused."
          oneOf:
            - $ref: "#/components/schemas/Task1Data"
            - $ref: "#/components/schemas/Task2Data"
            - $ref: "#/components/schemas/Task3Data"
            - $ref: "#/components/schemas/PaymentData"
            - $ref: "#/components/schemas/Task6Data"
            - $ref: "#/components/schemas/Task8Data"
            - $ref: "#/components/schemas/Task9Data"
            - $ref: "#/components/schemas/Task10Data"
            - $ref: "#/components/schemas/Task11Data"
            - $ref: "#/components/schemas/Task12Data"
            - $ref: "#/components/schemas/Task13Data"
    SaveTaskNotesRequest:
      type: object
      properties:
        notes: { type: string, maxLength: 2000 }
    Task1Data:
      type: object
      description: "Task 1: the initial quotation amounts."
      properties:
        initialToyotaAmount:
          {
            type: string,
            nullable: true,
            example: "1250.50",
            description: Decimal string with two decimals.,
          }
        initialCommission:
          {
            type: string,
            nullable: true,
            example: "1250.50",
            description: Decimal string with two decimals.,
          }
        accessoryAmount:
          {
            type: string,
            nullable: true,
            example: "1250.50",
            description: Decimal string with two decimals.,
          }
        releaseProcessingAmount:
          {
            type: string,
            nullable: true,
            example: "1250.50",
            description: Decimal string with two decimals.,
          }
    Task2Data:
      type: object
      description: "Task 2: the person who signs and the due-diligence classification."
      properties:
        signerDocumentType:
          { type: string, enum: [DNI, CE, PAS, CDI], nullable: true }
        signerDocumentNumber: { type: string, nullable: true }
        signerFirstName: { type: string, nullable: true }
        signerLastName: { type: string, nullable: true }
        signerNameSource:
          { type: string, enum: [manual, looked_up], nullable: true }
        pepStatus:
          { type: string, enum: [no_pep, pep, related_to_pep], nullable: true }
        ddcRegime: { type: string, enum: [general, reinforced], nullable: true }
    Task3Data:
      type: object
      description: "Task 3: the unit assigned and the final amount Toyota charges. The final commission is calculated: initial Toyota amount plus initial commission minus the final Toyota amount, and must stay positive."
      properties:
        vehicleSeries: { type: string, nullable: true }
        vin:
          {
            type: string,
            nullable: true,
            description: "17 characters without I, O or Q.",
          }
        finalToyotaAmount:
          {
            type: string,
            nullable: true,
            example: "1250.50",
            description: Decimal string with two decimals.,
          }
    PaymentData:
      type: object
      description: "Tasks 4 (customer to Pana, expected amount = the quoted final price) and 5 (Pana to Toyota, expected amount = the final Toyota amount): one bank deposit. A deposit that differs from the expected amount needs a mismatchReason to complete."
      properties:
        bank:
          {
            type: string,
            enum: [bcp, bbva, scotiabank, interbank],
            nullable: true,
          }
        paymentDate: { type: string, format: date, nullable: true }
        transactionNumber: { type: string, nullable: true }
        depositedAmount:
          {
            type: string,
            nullable: true,
            example: "1250.50",
            description: Decimal string with two decimals.,
          }
        mismatchReason: { type: string, nullable: true }
    InvoiceData:
      type: object
      properties:
        number: { type: string, nullable: true, example: "F001-000123" }
        date: { type: string, format: date, nullable: true }
        amount:
          {
            type: string,
            nullable: true,
            example: "1250.50",
            description: Decimal string with two decimals.,
          }
        mismatchReason: { type: string, nullable: true }
    Task6Data:
      type: object
      description: "Task 6: four invoices. Expected amounts: Toyota = final Toyota amount, commission = final commission, accessories = accessory amount, release processing = release amount."
      properties:
        toyota: { $ref: "#/components/schemas/InvoiceData" }
        commission: { $ref: "#/components/schemas/InvoiceData" }
        accessories: { $ref: "#/components/schemas/InvoiceData" }
        releaseProcessing: { $ref: "#/components/schemas/InvoiceData" }
    Task8Data:
      type: object
      description: "Task 8: customs."
      properties:
        damNumber: { type: string, nullable: true }
        customsOffice:
          { type: string, enum: [callao_maritima, chancay], nullable: true }
        controlChannel:
          { type: string, enum: [green, orange, red], nullable: true }
    Task9Data:
      type: object
      description: "Task 9: the release process."
      properties:
        personInCharge: { type: string, nullable: true }
    Task10Data:
      type: object
      description: "Task 10: registration."
      properties:
        licensePlate:
          {
            type: string,
            nullable: true,
            description: 6 alphanumeric characters.,
          }
        registrationDate: { type: string, format: date, nullable: true }
    Task11Data:
      type: object
      description: "Task 11: the transfer to the PDS."
      properties:
        pdsTransferDate: { type: string, format: date, nullable: true }
    Task12Data:
      type: object
      description: "Task 12: equipment installation."
      properties:
        serviceOrderNumber: { type: string, nullable: true }
        equipmentCompletionDate: { type: string, format: date, nullable: true }
    Task13Data:
      type: object
      description: "Task 13: delivery. The Surquillo transfer date is optional."
      properties:
        surquilloTransferDate: { type: string, format: date, nullable: true }
        deliveryDate: { type: string, format: date, nullable: true }
