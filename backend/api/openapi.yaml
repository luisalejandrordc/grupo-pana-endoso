    post:
      tags: [Customers]
      operationId: resendCustomerActivation
      summary: Send the customer a new activation link (Admin, Manager)
      description: >-
        Only for customers who have not set a password yet. The email is queued and sent within moments; the
        previous link stops working when the new one is sent. Customers who are inactive or already activated are
        refused.
      security:
        - bearerAuth: []
