  /sales:
    get:
      tags: [Sales]
      operationId: listSales
      summary: The sales workspace
      description: |
        An Advisor only ever gets their own sales, in the list and in the count; the advisorId filter cannot widen
        that. Managers and Admins see every sale. currentTask is the in-progress task or, when none is in
        progress, the lowest task not yet completed; a completed sale has none.
      security:
        - bearerAuth: []
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string },
            description: "Customer name, document, vehicle, series, VIN, plate or sale code.",
          }
        - {
            name: state,
            in: query,
            schema: { $ref: "#/components/schemas/SaleState" },
          }
        - {
            name: currentTask,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 13 },
          }
        - {
            name: milestone,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 6 },
            description: "Sales whose current task belongs to this milestone.",
          }
        - { name: advisorId, in: query, schema: { type: string, format: uuid } }
        - {
            name: customerType,
            in: query,
            schema: { $ref: "#/components/schemas/CustomerType" },
          }
        - {
            name: temperature,
            in: query,
            schema: { $ref: "#/components/schemas/SaleTemperature" },
          }
        - { name: modelId, in: query, schema: { type: string, format: uuid } }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - name: sort
          in: query
          schema:
            {
              type: string,
              enum:
                [
                  "-createdAt",
                  createdAt,
                  customerName,
                  "-customerName",
                  updatedAt,
                  "-updatedAt",
                  dueDate,
                ],
              default: "-createdAt",
            }
      responses:
        "200":
          description: One page of sales.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Sales]
      operationId: createSale
      summary: Start a sale
      description: |
        Records the customer and the vehicle as they are now, creates the 13 pending tasks and assigns the advisor.
        An Advisor creates for themselves; a Manager or Admin must choose an active Advisor. The customer must be
        active and the version and color must be selectable. The customer is notified, and so is an advisor who
        did not create the sale themselves.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSaleRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    get:
      tags: [Sales]
      operationId: getSale
      summary: Read a sale
      description: A sale an Advisor does not own answers 404, as if it did not exist.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The sale with its tasks, milestones and permissions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Sales]
      operationId: updateSaleNotes
      summary: Edit the sale's notes
      description: Notes are the only editable field of a sale besides its advisor. version is required.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSaleNotesRequest" }
      responses:
        "200":
          description: The updated sale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Sales]
      operationId: deleteSale
      summary: Permanently delete a sale that never reached delivery (Admin)
      description: |
        For test and erroneous sales only. The reason and the typed sale code are required. The sale's files leave
        storage after the commit; the audit trail survives. A sale whose task 13 was ever completed cannot be
        deleted, even if that task was reopened.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteSaleRequest" }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/history:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    get:
      tags: [Sales]
      operationId: getSaleHistory
      summary: The sale's timeline, newest first
      security:
        - bearerAuth: []
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleHistory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sales/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    post:
      tags: [Sales]
      operationId: cancelSale
      summary: Cancel an active sale
      description: |
        An Advisor may cancel their own sale while the current task is 1 to 3, a Manager while it is 1 to 6, an Admin
        at any stage (CANCEL_NOT_ALLOWED otherwise). The category and the reason are both required. The sale and its
        tasks freeze; reminders stop; the series, VIN and plate become free for other sales.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelSaleRequest" }
      responses:
        "200":
          description: The cancelled sale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/reopen:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    post:
      tags: [Sales]
      operationId: reopenSale
      summary: Reopen a cancelled sale (Manager, Admin)
      description: |
        A Manager only if it was cancelled while the current task was 1 to 6; an Admin always (REOPEN_NOT_ALLOWED
        otherwise). The in-progress task's start time and due date move forward by the time the sale spent cancelled.
        If another sale took its series, VIN or plate meanwhile, the reopen is refused with that conflict.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: The reopened sale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/reassign:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    post:
      tags: [Sales]
      operationId: reassignSale
      summary: Hand an active sale to another Advisor (Manager, Admin)
      description: The customer, the new advisor and the previous advisor are notified.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReassignSaleRequest" }
      responses:
        "200":
          description: The reassigned sale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/tasks:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    get:
      tags: [Tasks]
      operationId: listSaleTasks
      summary: The 13 tasks of a sale
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The tasks in order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TaskSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sales/{id}/tasks/{number}:
    parameters:
      - $ref: "#/components/parameters/SaleId"
      - $ref: "#/components/parameters/TaskNumber"
    get:
      tags: [Tasks]
      operationId: getSaleTask
      summary: One task with its data, calculated values, documents, warnings and the actions available
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sales/{id}/tasks/{number}/start:
    parameters:
      - $ref: "#/components/parameters/SaleId"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: startTask
      summary: Start the eligible task
      description: |
        A task is eligible when the previous one is completed and none is in progress. Starting sets the due date
        when the task has an SLA. An Advisor acts only on their own sale.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The started task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /sales/{id}/tasks/{number}/complete:
    parameters:
      - $ref: "#/components/parameters/SaleId"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: completeTask
      summary: Complete the task in progress
      description: |
        Every missing field and required document is reported at once (TASK_INCOMPLETE, with the fields). An amount
        that differs from the expected one needs a reason. Completing task 13 completes the sale. Customers are
        notified at the milestone tasks (1, 3, 6, 7, 10, 11, 13), never twice for the same task.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The completed task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/tasks/{number}/restart:
    parameters:
      - $ref: "#/components/parameters/SaleId"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: restartTask
      summary: Put the task in progress back to pending (Manager, Admin)
      description: Clears its clock and reminders. The data and files already saved are kept, read-only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: The restarted task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/tasks/{number}/reopen:
    parameters:
      - $ref: "#/components/parameters/SaleId"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: reopenTask
      summary: Reopen the last completed task (Manager, Admin)
      description: |
        Only the last completed task, and only when no task is in progress. It keeps its original start time and due
        date. Reopening task 13 of a completed sale makes the sale active again.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "200":
          description: The reopened task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/tasks/{number}/data:
    parameters:
      - $ref: "#/components/parameters/SaleId"
      - $ref: "#/components/parameters/TaskNumber"
    patch:
      tags: [Tasks]
      operationId: saveTaskData
      summary: Save the fields of a task
      description: |
        While the task is in progress an Advisor on their own sale (or a Manager or Admin) saves a draft: a field that
        is absent is left alone, an empty string clears it. A completed task can only be corrected by a Manager or
        Admin with a written reason, and the correction must leave it complete. Impossible values are refused;
        out-of-order dates only warn. version (the task's) is required. A pending task is read-only.
        Financial fields lock once a later task that depends on them is completed
        (TASK_FINANCIAL_FIELD_LOCKED). Identifiers must be unique among active and completed sales.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveTaskDataRequest" }
      responses:
        "200":
          description: The task after saving, with its warnings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/tasks/{number}/notes:
    parameters:
      - $ref: "#/components/parameters/SaleId"
      - $ref: "#/components/parameters/TaskNumber"
    patch:
      tags: [Tasks]
      operationId: saveTaskNotes
      summary: Save the free-text notes of a task
      description: |
        Notes have no version: the last save wins, and saving them does not change the task's `version`, so a data
        form that is open never goes stale because of a note. An Advisor writes notes only while the task is in
        progress; a Manager or Admin on any task of a sale that is not cancelled. The history records that the notes
        changed, never their text.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveTaskNotesRequest" }
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /sales/{id}/documents:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    get:
      tags: [Documents]
      operationId: listSaleDocuments
      summary: Every document slot of a sale with its current file
      description: |
        One entry per slot, in task order. `required` says whether the task engine needs the slot for this sale's
        customer type (the power of attorney is not required for a Diplomático). A sale outside an Advisor's scope
        answers 404.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The slots.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentSlotList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sales/{id}/tasks/{number}/documents/{slot}:
    parameters:
      - $ref: "#/components/parameters/SaleId"
      - $ref: "#/components/parameters/TaskNumber"
      - $ref: "#/components/parameters/DocumentSlot"
    put:
      tags: [Documents]
      operationId: uploadSaleDocument
      summary: Upload a file to a slot, replacing the current one
      description: |
        `multipart/form-data` with one `file` part and an optional `reason` text part. The file is checked by its
        content, not its name or declared type: a PDF slot takes only a PDF and an Excel slot only an .xlsx or .xls
        workbook, up to 10 MB (DOCUMENT_TYPE_NOT_ALLOWED, DOCUMENT_TOO_LARGE). While the task is in progress its
        actors (the assigned Advisor, a Manager, an Admin) can upload. On a completed task only a Manager or Admin can
        replace a file, and `reason` is then required. A new file answers 201 and a replacement 200. The replaced
        file is deleted from storage after the change commits.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The file replaced the previous one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentFile" }
        "201":
          description: The file was stored in an empty slot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentFile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413":
          description: The file is larger than 10 MB (DOCUMENT_TOO_LARGE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503":
          description: File storage is not available (STORAGE_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [Documents]
      operationId: removeSaleDocument
      summary: Remove the file of a slot
      description: |
        Allowed only while the task is in progress; a completed task can have a file replaced but never removed. The
        stored file is deleted after the change commits and the removal is audited.
      security:
        - bearerAuth: []
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /documents/{id}/download-url:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Documents]
      operationId: getDocumentDownloadUrl
      summary: A short-lived signed address to download a file
      description: |
        Issued only after the caller's role and scope are checked; a document of a sale outside an Advisor's scope
        answers 404. The address expires after a few minutes and makes the browser save the file under its original
        name. Storage addresses are never exposed in any other way.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The signed address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentDownload" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: File storage is not available (STORAGE_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /analytics/overview:
    get:
      tags: [Analytics]
      operationId: getAnalyticsOverview
      summary: Summary tab - snapshot, period KPIs, money, pipeline by milestone, trend and attention list
      description: |
        Every Staff role may call it. An Advisor always gets only their own sales (the advisorId filter cannot widen
        that) and the `money.internal` block is null. Managers and Admins see every sale.

        **Snapshot** figures describe the situation now and ignore the period; the other filters still apply.
        **Period** figures use an event date: created = created_at, completed = completed_at, cancelled = cancelled_at.
        The previous period is the equal-length range that ends the day before `from`.

        **Money** is what the sales recorded (USD), never accounting figures. A sale's *value* is its quoted final
        price (task 1) and, until that exists, the catalog reference price taken at creation; `estimatedCount` says how
        many sales used that fallback.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsAdvisorId"
        - $ref: "#/components/parameters/AnalyticsCustomerType"
        - $ref: "#/components/parameters/AnalyticsModelId"
        - $ref: "#/components/parameters/AnalyticsTemperature"
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsOverview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /analytics/process:
    get:
      tags: [Analytics]
      operationId: getAnalyticsProcess
      summary: Process tab - time, waiting, deadlines, load and rework per task
      description: |
        Timing uses tasks completed (completed_at) inside the period. Work time is completed_at minus started_at.
        Waiting time is the time between the task becoming eligible (the previous task's completion, or the sale's
        creation for task 1) and its start; negative values caused by reopened earlier tasks are ignored.
        Deadline compliance covers only the tasks that have a recommended duration. Rework counts the audit events
        RESTARTED, REOPENED and CORRECTED of task instances inside the period. Current load is a snapshot of active
        sales. An Advisor only sees their own sales.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsAdvisorId"
        - $ref: "#/components/parameters/AnalyticsCustomerType"
        - $ref: "#/components/parameters/AnalyticsModelId"
        - $ref: "#/components/parameters/AnalyticsTemperature"
      responses:
        "200":
          description: The process figures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsProcess" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /analytics/commercial:
    get:
      tags: [Analytics]
      operationId: getAnalyticsCommercial
      summary: Commercial tab - what sells, what is lost, and the money behind it
      description: |
        Groups sales created in the period. Close rate is completed divided by completed plus cancelled among the
        sales of the group that are already resolved; sales still in progress are counted apart so they never bias it.
        Money is recorded operational data in USD. Fields marked as Manager or Admin only are null for an Advisor.
        An Advisor only sees their own sales.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsAdvisorId"
        - $ref: "#/components/parameters/AnalyticsCustomerType"
        - $ref: "#/components/parameters/AnalyticsModelId"
        - $ref: "#/components/parameters/AnalyticsTemperature"
        - name: groupBy
          in: query
          description: What the vehicle ranking groups by. Defaults to model; the ranking returns the ten largest groups.
          schema: { type: string, enum: [model, version, color, category] }
      responses:
        "200":
          description: The commercial figures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsCommercial" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /analytics/team:
    get:
      tags: [Analytics]
      operationId: getAnalyticsTeam
      summary: Team tab - one row per advisor (Manager and Admin)
      description: |
        Advisors with an active sale or any sale created, completed or cancelled in the period. Sales are attributed to
        the advisor currently assigned, even if they were reassigned. The advisorId filter is ignored here.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
        - $ref: "#/components/parameters/AnalyticsCustomerType"
        - $ref: "#/components/parameters/AnalyticsModelId"
        - $ref: "#/components/parameters/AnalyticsTemperature"
      responses:
        "200":
          description: The advisors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsTeam" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /analytics/system:
    get:
      tags: [Analytics]
      operationId: getAnalyticsSystem
      summary: System tab - email delivery, sign-ins, accounts and storage (Admin)
      description: |
        Only the period applies; the sales filters do not. The monthly Codart usage is served by
        GET /lookups/identity/quota.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AnalyticsFrom"
        - $ref: "#/components/parameters/AnalyticsTo"
      responses:
        "200":
          description: The system figures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsSystem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/customer/login:
    post:
      tags: [Portal]
      operationId: customerLogin
      summary: Sign in to the customer portal
      description: >-
        Document and password of a customer whose account is activated. Every failure (unknown account, wrong password,
        locked, inactive, not yet activated) answers INVALID_CREDENTIALS. Customers sign in with any of their document
        types (DNI, CE, PAS, CDI, RUC).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerLoginRequest" }
      responses:
        "200":
          description: Signed in. The refresh token is set as an HttpOnly cookie.
          headers:
            Set-Cookie:
              description: The refresh cookie (ef_customer_refresh), scoped to /api/v1/auth/customer.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/customer/refresh:
    post:
      tags: [Portal]
      operationId: customerRefreshSession
      summary: Rotate the customer's refresh token and get a new access token
      security:
        - customerRefreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: A new access token. The cookie is rotated, except inside the 10-second grace window.
          headers:
            Set-Cookie:
              description: The rotated refresh cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerSessionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/customer/logout:
    post:
      tags: [Portal]
      operationId: customerLogout
      summary: End the customer's session
      security:
        - customerRefreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: The session ended and the cookie was cleared. It never fails for an unknown token.
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/customer/forgot-password:
    post:
      tags: [Portal]
      operationId: customerForgotPassword
      summary: Ask for a password reset email
      description: >-
        Always answers 202, whether or not the document belongs to a customer with an activated account, so it cannot
        be used to discover which documents exist. The reset link opens in the customer portal and is completed with
        POST /auth/reset-password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/CustomerForgotPasswordRequest" }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /portal/me:
    get:
      tags: [Portal]
      operationId: portalMe
      summary: The signed-in customer's profile
      security:
        - customerBearerAuth: []
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /portal/me/password:
    put:
      tags: [Portal]
      operationId: portalChangePassword
      summary: Change the signed-in customer's password
      description: Every session of the account ends, including this one.
      security:
        - customerBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204":
          description: The password was changed and the cookie cleared.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /portal/sales:
    get:
      tags: [Portal]
      operationId: portalListSales
      summary: The signed-in customer's purchases, newest first
      description: Each with its vehicle and its six milestones. Never anyone else's.
      security:
        - customerBearerAuth: []
      responses:
        "200":
          description: The purchases.
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalSaleList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /portal/sales/{id}:
    parameters:
      - $ref: "#/components/parameters/SaleId"
    get:
      tags: [Portal]
      operationId: portalGetSale
      summary: One of the customer's purchases in full
      description: |
        Sections appear only for COMPLETED tasks and carry only the fields and files the specification marks as
        customer-visible. A reopened or restarted task disappears and its milestone moves back. A cancelled purchase
        is shown as cancelled, without the reason. A purchase that belongs to someone else, or does not exist,
        answers 404 SALE_NOT_FOUND in exactly the same way.
      security:
        - customerBearerAuth: []
      responses:
        "200":
          description: The purchase.
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalSaleDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /portal/documents/{id}/download-url:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Portal]
      operationId: portalGetDocumentDownloadUrl
      summary: A short-lived signed address to download one of the customer's files
      description: |
        Issued only for a file of the customer's own purchase, in a customer-visible slot, whose task is completed.
        Any other file (someone else's, internal, or of a task that was reopened) answers 404 DOCUMENT_NOT_FOUND,
        exactly like a file that does not exist.
      security:
        - customerBearerAuth: []
      responses:
        "200":
          description: The signed address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentDownload" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: File storage is not available (STORAGE_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: ef_employee_refresh
    customerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token of a customer (the account type claim is "customer"). An employee's token is refused here, and this one is refused everywhere else.
    customerRefreshCookie:
      type: apiKey
      in: cookie
      name: ef_customer_refresh
  parameters:
    AnalyticsFrom:
      name: from
      in: query
      description: First day of the period (Lima date, inclusive). Defaults to 89 days before `to`, so the default period is 90 days.
      schema: { type: string, format: date }
    AnalyticsTo:
      name: to
      in: query
      description: Last day of the period (Lima date, inclusive). Defaults to today. The period may not exceed 731 days and `from` may not be after `to`.
      schema: { type: string, format: date }
    AnalyticsAdvisorId:
      name: advisorId
      in: query
      description: Only this advisor's sales. Ignored for an Advisor, who only ever sees their own.
      schema: { type: string, format: uuid }
    AnalyticsCustomerType:
      name: customerType
      in: query
      schema: { $ref: "#/components/schemas/CustomerType" }
    AnalyticsModelId:
      name: modelId
      in: query
      schema: { type: string, format: uuid }
    AnalyticsTemperature:
      name: temperature
      in: query
      schema: { $ref: "#/components/schemas/SaleTemperature" }
    SaleId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskNumber:
      name: number
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 13 }
    DocumentSlot:
      name: slot
      in: path
      required: true
      description: The slot code, such as quotation_pdf. It must belong to the task in the path.
      schema: { type: string }
    VehicleModelId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VehicleVersionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VehicleColorId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmployeeId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CsrfHeader:
      name: X-Requested-With
      in: header
      required: true
      description: Must be EndosoFlow. A form on another site cannot send it.
      schema: { type: string, enum: [EndosoFlow] }
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing, expired or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The employee's role does not allow this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: The record does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: The request conflicts with the current state (version, uniqueness or a business rule).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unprocessable:
      description: The data breaks a validation or business rule. Field problems are listed in error.fields.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, error] }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: Stable English code. }
            message:
              { type: string, description: Spanish text that is safe to show. }
            fields:
              type: array
              items: { $ref: "#/components/schemas/FieldError" }
            requestId: { type: string }
    CustomerLoginRequest:
      type: object
      required: [documentType, documentNumber, password]
      properties:
        documentType: { type: string, enum: [DNI, CE, PAS, CDI, RUC] }
        documentNumber: { type: string }
        password: { type: string }
        rememberMe: { type: boolean }
    CustomerForgotPasswordRequest:
      type: object
      required: [documentType, documentNumber]
      properties:
        documentType: { $ref: "#/components/schemas/CustomerDocumentType" }
        documentNumber: { type: string }
    CustomerProfile:
      type: object
      required: [id, displayName, documentType, documentNumber, email, phone]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        documentType: { type: string, enum: [DNI, CE, PAS, CDI, RUC] }
        documentNumber: { type: string }
        email: { type: string }
        phone: { type: string }
    CustomerSessionResponse:
      type: object
      required: [accessToken, expiresAt, customer]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        customer: { $ref: "#/components/schemas/CustomerProfile" }
    PortalMilestone:
      type: object
      required: [number, name, description, state]
      properties:
        number: { type: integer, minimum: 1, maximum: 6 }
        name: { type: string }
        description: { type: string }
        state: { type: string, enum: [pending, in_progress, completed] }
    PortalAdvisor:
      type: object
      description: The business contact of the person in charge. Nothing personal is shared.
      required: [name, email, phone, gender]
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        gender: { type: string, enum: [M, F] }
    PortalVehicleSummary:
      type: object
      required: [model, version, color, mainImageUrl]
      properties:
        model: { type: string }
        version: { type: string }
        color: { type: string }
        mainImageUrl:
          {
            type: string,
            description: "A public address, or empty when the color has no main photo.",
          }
    PortalSaleSummary:
      type: object
      required: [id, code, state, createdAt, vehicle, milestones]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: EF-2026-00042 }
        state: { type: string, enum: [active, completed, cancelled] }
        createdAt: { type: string, format: date-time }
        vehicle: { $ref: "#/components/schemas/PortalVehicleSummary" }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/PortalMilestone" }
    PortalSaleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PortalSaleSummary" }
    PortalImage:
      type: object
      required: [viewpoint, url]
      properties:
        viewpoint: { type: string }
        url:
          {
            type: string,
            description: "A public address: catalog photos are public by design.",
          }
    PortalVehicle:
      type: object
      required:
        [
          model,
          version,
          color,
          referencePrice,
          categories,
          mainImageUrl,
          images,
        ]
      properties:
        model: { type: string }
        version: { type: string }
        color: { type: string }
        referencePrice:
          {
            type: string,
            description: "A decimal amount in USD, as it was when the sale was made.",
          }
        categories: { type: array, items: { type: string } }
        mainImageUrl: { type: string }
        images:
          type: array
          items: { $ref: "#/components/schemas/PortalImage" }
    PortalField:
      type: object
      required: [key, label, kind, value]
      properties:
        key: { type: string }
        label: { type: string }
        kind:
          {
            type: string,
            enum: [text, date, money],
            description: "date is YYYY-MM-DD; money is a decimal string in USD.",
          }
        value: { type: string }
    PortalDocument:
      type: object
      required: [id, taskNumber, label, fileName, sizeBytes, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        taskNumber: { type: integer }
        label: { type: string }
        fileName: { type: string }
        sizeBytes: { type: integer }
        uploadedAt: { type: string, format: date-time }
    PortalSection:
      type: object
      description: What the customer reads about one completed task.
      required:
        [taskNumber, milestoneNumber, title, completedAt, fields, documents]
      properties:
        taskNumber: { type: integer, minimum: 1, maximum: 13 }
        milestoneNumber: { type: integer, minimum: 1, maximum: 6 }
        title: { type: string }
        completedAt: { type: string, format: date-time }
        fields:
          type: array
          items: { $ref: "#/components/schemas/PortalField" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/PortalDocument" }
    PortalSaleDetail:
      type: object
      required:
        [
          id,
          code,
          state,
          createdAt,
          completedAt,
          vehicle,
          advisor,
          milestones,
          sections,
        ]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: EF-2026-00042 }
        state: { type: string, enum: [active, completed, cancelled] }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        vehicle: { $ref: "#/components/schemas/PortalVehicle" }
        advisor: { $ref: "#/components/schemas/PortalAdvisor" }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/PortalMilestone" }
        sections:
          type: array
          items: { $ref: "#/components/schemas/PortalSection" }
    Accepted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted] }
    Role:
      type: string
      enum: [system_admin, sales_manager, sales_advisor]
    DocumentType:
      type: string
      enum: [DNI, CE, PAS]
    LoginRequest:
      type: object
      required: [documentType, documentNumber, password]
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        password: { type: string }
        rememberMe: { type: boolean, default: false }
    TokenPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 10, maxLength: 128 }
    ForgotPasswordRequest:
      type: object
      required: [documentType, documentNumber]
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 10, maxLength: 128 }
    Profile:
      type: object
      required:
        [
          id,
          documentType,
          documentNumber,
          firstName,
          lastName,
          businessEmail,
          role,
          hasPhoto,
        ]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        businessEmail: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        hasPhoto:
          {
            type: boolean,
            description: Whether there is a profile picture to ask for.,
          }
    SessionResponse:
      type: object
      required: [accessToken, expiresAt, employee]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        employee: { $ref: "#/components/schemas/Profile" }
    Employee:
      type: object
      required:
        [
          id,
          documentType,
          documentNumber,
          firstName,
          lastName,
          nameSource,
          nationality,
          gender,
          birthdate,
          hireDate,
          businessPhone,
          businessEmail,
          role,
          isActive,
          hasPhoto,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        nameSource: { type: string, enum: [manual, looked_up] }
        nationality: { type: string }
        gender: { type: string, enum: [M, F] }
        birthdate: { type: string, format: date }
        hireDate: { type: string, format: date }
        personalPhone: { type: string, nullable: true }
        personalEmail: { type: string, nullable: true }
        businessPhone: { type: string }
        businessEmail: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        isActive: { type: boolean }
        hasPhoto:
          {
            type: boolean,
            description: Whether there is a profile picture to ask for.,
          }
        activatedAt:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Null until the person sets a password.,
          }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EmployeeList:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Employee" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    CreateEmployeeRequest:
      type: object
      required:
        [
          documentType,
          documentNumber,
          firstName,
          lastName,
          nationality,
          gender,
          birthdate,
          hireDate,
          businessPhone,
          businessEmail,
          role,
        ]
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        nameSource: { type: string, enum: [manual, looked_up], default: manual }
        nationality: { type: string }
        gender: { type: string, enum: [M, F] }
        birthdate: { type: string, format: date }
        hireDate: { type: string, format: date }
        personalPhone: { type: string, nullable: true }
        personalEmail: { type: string, nullable: true }
        businessPhone: { type: string }
        businessEmail: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    UpdateEmployeeRequest:
      type: object
      required: [version]
